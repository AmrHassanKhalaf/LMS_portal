<!--
Messages Component
==================
Displays flash messages (success, error, warning) passed from Django views.
Uses Bootstrap's alert dismissible classes.
-->
{% if messages %}
    <div class="messages-container mb-4">
        {% for message in messages %}
            <!-- message.tags translates to bootstrap classes (e.g., alert-success) defined in settings.py -->
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">
                {% if message.tags == 'success' %}
                    <i class="bi bi-check-circle-fill me-2"></i>
                {% elif message.tags == 'danger' or message.tags == 'error' %}
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                {% elif message.tags == 'warning' %}
                    <i class="bi bi-exclamation-circle-fill me-2"></i>
                {% else %}
                    <i class="bi bi-info-circle-fill me-2"></i>
                {% endif %}
                
                {{ message }}
                
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>
{% endif %}
