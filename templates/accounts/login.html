{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header bg-primary text-white text-center py-4 rounded-top">
                <i class="bi bi-mortarboard-fill fs-1"></i>
                <h3 class="font-weight-light my-2">SMS Portal Login</h3>
            </div>
            <div class="card-body p-4">
                <form method="post" action="{% url 'accounts:login' %}">
                    {% csrf_token %}
                    <!-- crispy handles form rendering with bootstrap 5 styles automatically -->
                    {{ form|crispy }}
                    
                    <div class="d-flex justify-content-between align-items-center mt-4 mb-0">
                        <a class="small text-decoration-none" href="{% url 'accounts:password_reset' %}">Forgot Password?</a>
                        <button class="btn btn-primary px-4" type="submit">Login</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3 bg-light rounded-bottom">
                <div class="small"><a href="{% url 'accounts:register' %}" class="text-decoration-none">Need an account? Sign up!</a></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
