{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Upload Material - {{ course.subject.code }}{% endblock %}

{% block content %}
<div class="row justify-content-center pt-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <div class="d-flex align-items-center">
                    <i class="bi bi-cloud-upload fs-3 text-primary me-2"></i>
                    <h3 class="fw-bold mb-0">Upload Course Material</h3>
                </div>
                <p class="text-muted mt-2 mb-0">Adding resource for <strong>{{ course.subject.title }}</strong></p>
            </div>
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    
                    <div class="d-flex justify-content-end mt-4">
                        <a href="{% url 'academics:course_material_list' course.id %}" class="btn btn-light me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-upload me-1"></i> Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
